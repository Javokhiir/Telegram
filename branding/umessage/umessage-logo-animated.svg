<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 -185.5 820 820" width="512" height="512" color="#000">
  <title>U message</title>
  <style>
    .s { fill: none; stroke: currentColor; stroke-width: 74; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #bar { animation: draw .55s cubic-bezier(.65,0,.35,1) .1s forwards; }
    #arc { animation: draw .9s  cubic-bezier(.65,0,.35,1) .5s forwards; }
    /* the twin peels off the drawn mark and swings 180° to close the circle */
    #u { fill: currentColor; opacity: 0; transform-box: view-box; transform-origin: 525px 224.5px;
         animation: split 1.1s cubic-bezier(.7,0,.2,1.15) 1.45s forwards; }
    #pair { transform-box: view-box; transform-origin: 525px 224.5px;
            animation: settle .5s cubic-bezier(.34,1.56,.64,1) 2.5s; }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes split  { 0% { opacity: 1; transform: rotate(0); } 100% { opacity: 1; transform: rotate(180deg); } }
    @keyframes settle { 50% { transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) {
      .s { animation: none; stroke-dashoffset: 0; }
      #u { animation: none; opacity: 1; transform: rotate(180deg); }
      #pair { animation: none; }
    }
  </style>
  <g id="pair">
    <!-- "me": original mark drawn as strokes (identical to the filled mark once drawn) -->
    <path id="bar" class="s" pathLength="1" d="M155 49H525"/>
    <path id="arc" class="s" pathLength="1" d="M525 49A175.5 175.5 0 0 0 525 400"/>
    <!-- "U": the same mark, rotated 180° about the ring centre -->
    <g id="u">
      <rect x="155" y="12" width="370" height="74"/>
      <path d="M525 12A212.5 212.5 0 0 0 525 437V363A138.5 138.5 0 0 1 525 86Z"/>
    </g>
  </g>
</svg>
