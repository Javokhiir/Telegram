  <title>U message loading</title>
  <style>
    /* twin orbits: single mark -> closed circle -> single mark */
    #u { transform-box: view-box; transform-origin: 525px 224.5px;
         animation: orbit 1.8s cubic-bezier(.7,0,.3,1) infinite; }
    @keyframes orbit { 0% { transform: rotate(0); } 40%, 60% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
  </style>
